name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.12" # renovate: datasource=github-releases depName=rhysd/actionlint
  PYFLAKES_VERSION: "3.4.0" # renovate: datasource=pypi depName=pyflakes

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck scripts/sign.sh

  psscriptanalyzer:
    name: Lint PowerShell scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path scripts/sign.ps1 -Severity Error,Warning
          if ($results) {
            $results | Format-List
            exit 1
          }

  pyflakes:
    name: Lint Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pyflakes
        run: pip install "pyflakes==${PYFLAKES_VERSION}" --quiet

      - name: Run pyflakes
        run: python3 -m pyflakes scripts/mock-server.py

  smoke-test:
    name: Smoke test (mock server)
    runs-on: ubuntu-latest
    needs: [shellcheck, pyflakes]

    steps:
      - uses: actions/checkout@v4

      # Spin up the mock server from scripts/mock-server.py.
      # The same script can be run manually from a local checkout.
      - name: Start mock signing server
        run: |
          python3 scripts/mock-server.py --host 127.0.0.1 --port 16973 \
            --secret test-secret-value &
          # Give the server a moment to start
          sleep 1
          curl -sf http://127.0.0.1:16973/ | grep -q "osslsignserver mock"
          echo "Mock server is up"

      - name: Create test artifact
        run: echo "fake binary content" > /tmp/test-artifact.bin

      - name: Run action (sign test artifact)
        id: sign
        uses: ./
        with:
          url: http://127.0.0.1:16973
          api-key-secret: test-secret-value
          profile: test-profile
          file: /tmp/test-artifact.bin
          output: /tmp/test-artifact-signed.bin

      - name: Verify output exists
        run: |
          [ -f /tmp/test-artifact-signed.bin ] || {
            echo "::error::Signed artifact not found"
            exit 1
          }
          echo "signed-file output: ${{ steps.sign.outputs.signed-file }}"
          [ -n "${{ steps.sign.outputs.signed-file }}" ] || {
            echo "::error::signed-file output is empty"
            exit 1
          }
          echo "Smoke test passed ✓"

  smoke-test-windows:
    name: Smoke test Windows (mock server)
    runs-on: windows-latest
    needs: [psscriptanalyzer, pyflakes]

    steps:
      - uses: actions/checkout@v4

      - name: Start mock signing server
        shell: pwsh
        run: |
          # Use -WindowStyle Hidden (NOT -NoNewWindow) so the Python process gets
          # its own console and is not killed when this step's pwsh.exe exits.
          # With -NoNewWindow the child inherits the step's Windows Job Object
          # and is terminated when the step ends.
          Start-Process python3 `
            -ArgumentList @('scripts/mock-server.py', '--host', '127.0.0.1', '--port', '16973', '--secret', 'test-secret-value') `
            -WindowStyle Hidden
          # Retry until the server is accepting connections.
          # Python startup on Windows can be slow (Store shim indirection).
          $retries = 0
          do {
            Start-Sleep -Seconds 1
            $retries++
            & curl.exe -sf http://127.0.0.1:16973/ 2>&1 | Out-Null
          } while ($LASTEXITCODE -ne 0 -and $retries -lt 15)
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Mock server did not come up after $retries seconds"
          }
          Write-Output "Mock server is up (after ${retries}s)"

      - name: Create test artifact
        shell: pwsh
        run: |
          "fake binary content" | Set-Content -Path "$env:RUNNER_TEMP\test-artifact.bin" -NoNewline

      - name: Run action (sign test artifact)
        id: sign
        uses: ./
        with:
          url: http://127.0.0.1:16973
          api-key-secret: test-secret-value
          profile: test-profile
          file: ${{ runner.temp }}\test-artifact.bin
          output: ${{ runner.temp }}\test-artifact-signed.bin

      - name: Verify output exists
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP\test-artifact-signed.bin")) {
            Write-Output '::error::Signed artifact not found'
            exit 1
          }
          Write-Output "signed-file output: ${{ steps.sign.outputs.signed-file }}"
          if ([string]::IsNullOrEmpty("${{ steps.sign.outputs.signed-file }}")) {
            Write-Output '::error::signed-file output is empty'
            exit 1
          }
          Write-Output 'Smoke test passed ✓'

  actionlint:
    name: Lint workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          curl -sL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          sudo mv actionlint /usr/local/bin/

      - name: Run actionlint
        run: actionlint
